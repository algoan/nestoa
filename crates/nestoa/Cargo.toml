[package]
name = "nestoa"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Static OpenAPI / AsyncAPI generator for NestJS / TypeScript codebases"

[[bin]]
name = "nestoa"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
indexmap = { version = "2", features = ["serde"] }
walkdir = "2"
globset = "0.4"
ignore = "0.4"
rayon = "1"
swc_common = { version = "23", features = ["tty-emitter"] }
swc_ecma_ast = "25"
swc_ecma_parser = "41"
swc_ecma_visit = "25"
once_cell = "1"
