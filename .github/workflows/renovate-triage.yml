name: Renovate triage

# Labels the Renovate security PRs, with algoan/renovate-security-actions (renovate-security). The
# hotfix flow is off: nothing is deployed from this repository, the binary and its npm packages are
# released by a manual run of "Release".
#
# No ecosystem is scored: the triage knows no Rust (Cargo.lock), and the npm launcher has no lockfile
# nor third-party dependency. A Renovate PR with the `security` label (a RustSec advisory, for
# instance) gets `needs-review`, so it is never mistaken for a routine update; every other PR stays
# a regular PR. No automerge: with nothing scored, no PR reaches the automerge tier.
# See docs/RENOVATE.md.
#
# pull_request_target: the workflow always comes from the base branch, so a Renovate PR (or a push
# to its branch) cannot change what runs with a write GITHUB_TOKEN before review. The job only runs
# for PRs opened by renovate[bot]: a PR from a fork never gets that token.

on:
  pull_request_target:
    # No `edited`: Renovate rewrites its titles and descriptions, which changes nothing to score.
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  triage:
    name: Score vulnerabilities and route the PR
    # Renovate adds its labels right after opening the PR: of those, only `security` needs a new run.
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]'
      && (github.event.action != 'labeled' || github.event.label.name == 'security')
    # At the job level, so a run skipped by the condition above doesn't cancel a triage in progress.
    concurrency:
      group: renovate-triage-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The PR head is only read as git objects: nothing from it runs here.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Triage
        uses: algoan/renovate-security-actions/renovate-triage@cd8237c464811b26d5f344c7de2f01d77d42da9a # v1.1.0
        with:
          hotfix_enabled: "false"
          cvss_hotfix_threshold: ${{ vars.CVSS_HOTFIX_THRESHOLD || '9.0' }}
          cvss_automerge_threshold: ${{ vars.CVSS_AUTOMERGE_THRESHOLD || '4.0' }}
          # auto finds nothing to score today (no uv/poetry/npm/pnpm lockfile, pom.xml nor Dockerfile):
          # Cargo.lock is not an ecosystem of the triage. It picks up one added later.
          ecosystems: auto
