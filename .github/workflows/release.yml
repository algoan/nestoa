name: Release

# Publishes the platform binaries + the `nestoa` launcher to the GitHub
# Packages npm registry (under the @algoan scope) on a version tag.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# or trigger manually from the Actions tab (workflow_dispatch) with a version.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (without leading v), e.g. 0.1.0"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need full tag history to check for an existing release

      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "Resolved version: '$VERSION'"
          # Semver MAJOR.MINOR.PATCH with optional -prerelease / +build metadata.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid version '$VERSION'. Expected semver X.Y.Z (git tags must be vX.Y.Z, e.g. v0.1.3)."
            exit 1
          fi
          # For manual runs, refuse to re-release a version that already has a
          # tag. (Tag pushes are exempt: the tag IS the trigger, so it exists.)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists — version $VERSION has already been released. Bump the version."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version validated: $VERSION"

  build:
    name: Build ${{ matrix.tag }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: linux-x64-gnu
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - tag: linux-arm64-gnu
            target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross-linker: gcc-aarch64-linux-gnu
          - tag: darwin-x64
            target: x86_64-apple-darwin
            os: macos-14-large
          - tag: darwin-arm64
            target: aarch64-apple-darwin
            os: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Stamp Cargo version
        run: node npm/stamp-cargo-version.js "${{ needs.validate.outputs.version }}"

      - name: Install cross linker
        if: matrix.cross-linker
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cross-linker }}
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} --package nestoa

      - name: Package platform npm package
        working-directory: npm
        run: node build-platform-packages.js ${{ matrix.tag }} ../target/${{ matrix.target }}/release/nestoa

      - name: Upload platform package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.tag }}
          path: npm/platforms/${{ matrix.tag }}
          if-no-files-found: error

  publish:
    name: Publish to GitHub Packages
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release tag on manual runs
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js (GitHub Packages registry)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://npm.pkg.github.com"
          scope: "@algoan"

      - name: Download platform packages
        uses: actions/download-artifact@v8
        with:
          path: npm/platforms

      - name: Rewrite packages for GitHub Packages (@algoan scope)
        working-directory: npm
        run: node prepare-github-publish.js "${{ needs.validate.outputs.version }}"

      - name: Publish platform packages
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for dir in platforms/*/; do
            echo "::group::publish $dir"
            npm publish "$dir"
            echo "::endgroup::"
          done

      - name: Publish nestoa launcher
        working-directory: npm/nestoa
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish

      # Tag the released commit on manual (workflow_dispatch) runs. Tag pushes
      # already carry the tag, so this only runs for manual releases — and only
      # after publishing succeeds, so a failed release leaves no tag behind.
      - name: Tag release
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          git config user.name "algoanbot"
          git config user.email "bot@algoan.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
