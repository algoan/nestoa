name: Release

# Publishes the platform binaries + the `nestoa` launcher to the GitHub
# Packages npm registry (under the @algoan scope) on a version tag.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# or trigger manually from the Actions tab (workflow_dispatch) with a version.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (without leading v), e.g. 0.1.0"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.tag }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: linux-x64-gnu
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - tag: linux-arm64-gnu
            target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross-linker: gcc-aarch64-linux-gnu
          - tag: darwin-x64
            target: x86_64-apple-darwin
            os: macos-13
          - tag: darwin-arm64
            target: aarch64-apple-darwin
            os: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross linker
        if: matrix.cross-linker
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cross-linker }}
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} --package nestoa

      - name: Package platform npm package
        working-directory: npm
        run: node build-platform-packages.js ${{ matrix.tag }} ../target/${{ matrix.target }}/release/nestoa

      - name: Upload platform package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tag }}
          path: npm/platforms/${{ matrix.tag }}
          if-no-files-found: error

  publish:
    name: Publish to GitHub Packages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js (GitHub Packages registry)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://npm.pkg.github.com"
          scope: "@algoan"

      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          path: npm/platforms

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION"

      - name: Rewrite packages for GitHub Packages (@algoan scope)
        working-directory: npm
        run: node prepare-github-publish.js "${{ steps.version.outputs.version }}"

      - name: Publish platform packages
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for dir in platforms/*/; do
            echo "::group::publish $dir"
            npm publish "$dir"
            echo "::endgroup::"
          done

      - name: Publish nestoa launcher
        working-directory: npm/nestoa
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish
